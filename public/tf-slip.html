<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>TF Slip Web · Berlindo</title>
  <link rel="stylesheet" href="/leader.css">
  <link rel="stylesheet" href="/tf-slip.css?v=range1">
  <script defer src="/tf-slip.js?v=range1"></script>
</head>
<body>
  <main>
    <a class="screen-only" href="/leader?tab=reports">← Pemeriksaan leader</a>
    <p class="print-only">Berlindo · Digital Andon</p>
    <h1>TF Slip Web</h1>
    <p class="screen-only">Hasil produksi Line 1–8 dari LKH web yang telah disetujui dan selesai proses.</p>
    <section class="panel">
      <div class="filters screen-only">
        <label>Dari tanggal<input required type="date" id="date"></label>
        <label>Sampai tanggal<input required type="date" id="to"></label>
        <label>Shift<select id="shift"><option value="">Semua shift</option><option value="1">Shift 1</option><option value="2">Shift 2</option></select></label>
        <label>Line<select id="line"><option value="">Semua line</option></select></label>
        <button id="refresh" type="button">Muat ulang</button>
      </div>
      <div class="actions screen-only">
        <details id="columns">
          <summary>Pilih kolom</summary>
          <div id="choices"></div>
        </details>
        <button type="button" class="primary" id="print" disabled>Cetak / Simpan PDF</button>
      </div>
      <p id="scope" class="print-only"></p>
      <p id="summary" role="status"></p>
      <p id="timing"></p>
      <div class="scroll">
        <table hidden aria-label="Hasil produksi terverifikasi"><thead><tr></tr></thead><tbody></tbody></table>
      </div>
      <small class="screen-only">Jumlah laporan mencakup input melalui verifikasi web. Kelengkapan terhadap rencana shift perlu dicocokkan oleh leader.</small>
    </section>
  </main>
</body>
</html>
